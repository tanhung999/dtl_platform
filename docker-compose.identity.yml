# Add to docker-compose.prod.yml. Start keycloak first; enable OIDC only after rehearsal.
services:
  keycloak:
    image: dtl-platform-keycloak:26.8.1
    build:
      context: ./keycloak
    restart: unless-stopped
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://platform-keycloak:8080/auth
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_DB_POOL_INITIAL_SIZE: "1"
      KC_DB_POOL_MIN_SIZE: "1"
      KC_DB_POOL_MAX_SIZE: "10"
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx512m"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN:-identity-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_PASSWORD:?set KEYCLOAK_BOOTSTRAP_PASSWORD}
      PLATFORM_OIDC_CLIENT_SECRET: ${PLATFORM_OIDC_CLIENT_SECRET:?set PLATFORM_OIDC_CLIENT_SECRET}
      KEYCLOAK_USER_ADMIN_CLIENT_SECRET: ${KEYCLOAK_USER_ADMIN_CLIENT_SECRET:?set KEYCLOAK_USER_ADMIN_CLIENT_SECRET}
    volumes:
      - ./keycloak/production:/opt/keycloak/data/import:ro
    networks:
      internal:
        aliases: [platform-keycloak]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  backend:
    environment:
      OIDC_ENABLED: ${PLATFORM_IDENTITY_ENABLED:-false}
      OIDC_ALLOW_HTTP: "true"
      OIDC_SESSION_COOKIE_SECURE: "false"
      OIDC_FRONTEND_URL: http://platform.dongtayland.vn:8080
      OIDC_ISSUER: http://platform-keycloak:8080/auth/realms/dtl
      OIDC_TOKEN_URL: http://platform-keycloak:8080/auth/realms/dtl/protocol/openid-connect/token
      OIDC_JWKS_URL: http://platform-keycloak:8080/auth/realms/dtl/protocol/openid-connect/certs
      OIDC_END_SESSION_URL: http://platform-keycloak:8080/auth/realms/dtl/protocol/openid-connect/logout
      OIDC_AUTO_LINK_EXISTING_USERS: "false"
      KEYCLOAK_ADMIN_BASE_URL: http://platform-keycloak:8080/auth
      KEYCLOAK_ADMIN_REALM: dtl
      KEYCLOAK_ADMIN_CLIENT_ID: platform-user-admin
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
