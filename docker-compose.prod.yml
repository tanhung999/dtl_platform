services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:?set PLATFORM_POSTGRES_PASSWORD}
      POSTGRES_DB: dtl_platform_db
    volumes:
      - platform-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d dtl_platform_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DEBUG: "false"
      ALLOW_INSECURE_LOCAL_CONFIG: "false"
      SECRET_KEY: ${PLATFORM_SECRET_KEY:?set PLATFORM_SECRET_KEY}
      SSO_SECRET_KEY: ${PLATFORM_SSO_SECRET_KEY:?set PLATFORM_SSO_SECRET_KEY}
      DATABASE_URL: postgresql+asyncpg://platform_user:${PLATFORM_POSTGRES_PASSWORD:?set PLATFORM_POSTGRES_PASSWORD}@db:5432/dtl_platform_db
      CORS_ORIGINS: '["https://platform.dongtayland.vn","http://platform.dongtayland.vn:8080"]'
      BOOKING_REPORTS_URL: http://incomestatement.dongtayland.vn:8080
      WORKFLOWS_URL: http://workflow.dongtayland.vn:8080
      ASSET_MANAGER_URL: http://qlts.dongtayland.vn:8080
      OIDC_ENABLED: "false"
      OIDC_CLIENT_SECRET: ${PLATFORM_OIDC_CLIENT_SECRET:?set PLATFORM_OIDC_CLIENT_SECRET}
      OIDC_SESSION_ENCRYPTION_SECRET: ${PLATFORM_OIDC_SESSION_ENCRYPTION_SECRET:?set PLATFORM_OIDC_SESSION_ENCRYPTION_SECRET}
      INTEGRATION_BOOKINGREPORTS_SECRET: ${BOOKINGREPORTS_INTEGRATION_SECRET:?set BOOKINGREPORTS_INTEGRATION_SECRET}
      INTEGRATION_WORKFLOWS_SECRET: ${WORKFLOWS_INTEGRATION_SECRET:?set WORKFLOWS_INTEGRATION_SECRET}
      INTEGRATION_ITAM_SECRET: ${ITAM_INTEGRATION_SECRET:?set ITAM_INTEGRATION_SECRET}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_USER_ADMIN_CLIENT_SECRET:?set KEYCLOAK_USER_ADMIN_CLIENT_SECRET}
      NOTIFICATIONS_WORKER_ENABLED: "true"
      MAINTENANCE_ENABLED: "true"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal:
      proxy:
        aliases:
          - platform-api
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    restart: unless-stopped
    expose:
      - "80"
    networks:
      proxy:
        aliases:
          - platform-web
    logging: *default-logging

networks:
  internal:
  proxy:
    name: dtl-proxy
    external: true

volumes:
  platform-postgres-data:
    name: platform-postgres-data
