version: '3.8'

services:
  platform-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dtl-platform-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - SECRET_KEY=dtl_platform_production_secret_key_change_me
      - SSO_SECRET_KEY=dtl_sso_shared_secret_for_ticket_exchange_32_chars
      - DATABASE_URL=postgresql+asyncpg://platform_user:platform_pass@platform-db:5432/dtl_platform_db
      - BOOKING_REPORTS_URL=http://localhost:5174
      - WORKFLOWS_URL=http://localhost:8080
      - ASSET_MANAGER_URL=http://localhost:8444
    depends_on:
      - platform-db
      - platform-redis

  platform-frontend:
    image: node:20-alpine
    container_name: dtl-platform-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - platform-backend

  platform-db:
    image: postgres:16-alpine
    container_name: dtl-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: platform_pass
      POSTGRES_DB: dtl_platform_db
    ports:
      - "5434:5432"
    volumes:
      - platform_db_data:/var/lib/postgresql/data

  platform-redis:
    image: redis:7-alpine
    container_name: dtl-platform-redis
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  platform_db_data:
